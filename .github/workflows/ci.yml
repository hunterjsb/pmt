name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: pmproxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmtrader

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check Python syntax
        run: |
          python -m py_compile $(find pmtrader pmstrat -name "*.py" \
            -not -path "*/.venv/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/build/*" \
            -not -path "*/dist/*")

  test-pmstrat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmstrat

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

  build-rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [pmproxy, pmengine]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Build
        working-directory: ${{ matrix.crate }}
        run: cargo build --features ec2

      - name: Run tests
        working-directory: ${{ matrix.crate }}
        run: cargo test

  characterization:
    # Frozen real, wallet-graded windows (pmengine/fixtures) replayed through
    # the updown decision core. A failure here is a FINDING, not a chore: the
    # engine changed behaviour on a trade that actually happened. Triage it —
    # regenerating an expectation is a deliberate act that belongs in the PR
    # body, never a way to get CI green. See pmengine/fixtures/README.md.
    #
    # Its own job rather than a step inside build-rust so it is visible by
    # name and cannot be dropped by a change to the test filter.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pmengine

      - name: Build
        working-directory: pmengine
        run: cargo build --features ec2

      - name: Replay the committed fixtures
        working-directory: pmengine
        # HOME is redirected at an empty directory: the suite must pass on a
        # machine that has never run the engine, and a fixture that quietly
        # read ~/.pmt would sail through here otherwise. The binary is invoked
        # directly (not `cargo run`) because cargo itself wants a real HOME.
        run: |
          mkdir -p "$RUNNER_TEMP/no-home"
          HOME="$RUNNER_TEMP/no-home" ./target/debug/pmengine \
            --log-level warn replay --fixtures fixtures

  cargo-audit:
    # RUSTSEC advisory check on Cargo.lock for both Rust crates. Fails CI on
    # any vulnerability so we notice + refresh deps promptly. The binstall
    # path skips a long source build of cargo-audit on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-audit
      - name: Audit pmproxy
        working-directory: pmproxy
        run: cargo audit
      - name: Audit pmengine
        working-directory: pmengine
        # The rustls-webpki advisories ignored here are pinned by the
        # aws-config / aws-smithy transitive dep chain. See
        # pmengine/audit.toml for full rationale + threat-model reasoning.
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0235
