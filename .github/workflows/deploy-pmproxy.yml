name: Deploy pmproxy Lambda

on:
  # Auto-deploy when pmproxy/Cargo.toml version bumps on master.
  # The detect-bump job is the gate; it skips deploys for non-version pushes.
  push:
    branches: [master, main]
    paths:
      - 'pmproxy/Cargo.toml'
  # Manual trigger from the GitHub Actions UI.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: master)"
        required: false
        default: "master"
  # Auto-deploy when a pmproxy-v* release is published (e.g. manual tag push).
  release:
    types: [published]

concurrency:
  # Serialize Lambda deploys so two runs can't race the same resource.
  group: deploy-pmproxy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

permissions:
  id-token: write     # OIDC for AWS role assumption
  contents: write     # create tag + release on push-triggered deploys

jobs:
  detect-bump:
    # Only runs on push events. Compares pmproxy/Cargo.toml version against
    # the parent commit; if unchanged, deploy job is skipped.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare version with parent commit
        id: check
        run: |
          current=$(awk -F\" '/^version = / {print $2; exit}' pmproxy/Cargo.toml)
          previous=$(git show HEAD^:pmproxy/Cargo.toml 2>/dev/null | awk -F\" '/^version = / {print $2; exit}' || echo "")
          echo "version=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" == "$previous" ]]; then
            echo "::notice::pmproxy version unchanged ($current); skipping deploy"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::pmproxy version bumped: ${previous:-<none>} -> $current"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [detect-bump]
    # Run when:
    #   - push to master that bumped pmproxy/Cargo.toml version, OR
    #   - manual workflow_dispatch, OR
    #   - pmproxy-v* release published.
    # `always()` is needed so this job runs even when detect-bump was skipped
    # (workflow_dispatch / release events don't run detect-bump).
    if: |
      always() && !cancelled() && (
        (github.event_name == 'push' && needs.detect-bump.outputs.bumped == 'true') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'pmproxy-v'))
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build Lambda zip
        working-directory: pmproxy
        run: |
          cargo lambda build \
            --release \
            --no-default-features \
            --features lambda \
            --bin pmproxy-lambda \
            --output-format zip
          ls -lh target/lambda/pmproxy-lambda/bootstrap.zip

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::350985642081:role/pmproxy-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Push new code directly via the Lambda API. Infrastructure config changes
      # (env vars, memory, role, etc.) still go through `pulumi up` locally —
      # see infra/pulumi/lambda_proxy.py. CI only changes the running binary.
      - name: Update Lambda function code
        working-directory: pmproxy
        run: |
          aws lambda update-function-code \
            --function-name pmproxy \
            --zip-file fileb://target/lambda/pmproxy-lambda/bootstrap.zip \
            --publish \
            --query '{Version:Version,LastModified:LastModified,CodeSha256:CodeSha256}' \
            --output table

      - name: Wait for update to settle
        run: |
          aws lambda wait function-updated --function-name pmproxy
          aws lambda get-function-configuration \
            --function-name pmproxy \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}' \
            --output table

      - name: Verify deployed function responds
        id: verify
        run: |
          URL=$(aws lambda get-function-url-config --function-name pmproxy --query 'FunctionUrl' --output text)
          echo "Lambda URL: $URL"
          # /health is unauthenticated; expects JSON {"status":"healthy"}
          curl -sf "${URL}health" | tee /dev/stderr
          echo ""
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"

      - name: Set up Python for integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test deps
        working-directory: pmproxy/tests
        run: pip install -r requirements.txt

      - name: Run post-deploy verification against live Lambda
        working-directory: pmproxy/tests
        env:
          PMPROXY_URL: ${{ steps.verify.outputs.url }}
          PMPROXY_COGNITO_CLIENT_ID: ${{ secrets.PMPROXY_COGNITO_CLIENT_ID }}
          PMPROXY_COGNITO_REGION: ${{ secrets.PMPROXY_COGNITO_REGION }}
          PMPROXY_USERNAME: ${{ secrets.PMPROXY_USERNAME }}
          PMPROXY_PASSWORD: ${{ secrets.PMPROXY_PASSWORD }}
        run: pytest test_deployed.py -v

      # Tag the commit + create a GitHub release for traceability, but only for
      # push-triggered deploys (workflow_dispatch and release events skip this —
      # release events would create a duplicate; dispatch is ad-hoc).
      - name: Tag commit & create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.detect-bump.outputs.version }}"
          tag="pmproxy-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists; skipping creation."
            exit 0
          fi
          gh release create "$tag" \
            pmproxy/target/lambda/pmproxy-lambda/bootstrap.zip \
            --title "pmproxy ${version}" \
            --target "${{ github.sha }}" \
            --generate-notes
