[package]
name = "pmengine"
version = "0.4.0"
edition = "2021"
rust-version = "1.92"
description = "Rust HFT engine for Polymarket trading"

[package.metadata.cargo-machete]
# `openssl` looks unused to cargo-machete but is required for cross-compile
# static linking on glibc targets (the `vendored` feature is the whole point).
ignored = ["openssl"]

[dependencies]
# Polymarket official SDK
polymarket_client_sdk_v2 = { version = "0.7.0", features = ["clob", "data", "gamma", "ws"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config (EC2 only)
clap = { version = "4", features = ["derive"], optional = true }
dotenvy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numerics
rust_decimal = { version = "1", features = ["serde-with-str", "serde-with-float"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto
alloy = { version = "1.4", features = ["signers", "signer-local"] }
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
secrecy = "0.10"

# HTTP client (for L2 auth requests; blocking for strategy feed threads)
reqwest = { version = "0.13", features = ["json", "blocking"] }

# Sync WS client for strategy feed threads (Binance trade stream)
tungstenite = { version = "0.30", features = ["native-tls"] }

# OpenSSL with vendored feature for static linking (avoids version mismatches)
openssl = { version = "0.10", features = ["vendored"] }

# Async utilities
async-broadcast = "0.7"

# Control plane HTTP server (local introspection + future alert approval)
axum = "0.8"

# AWS SigV4 signing (optional, for pmproxy behind an AWS_IAM Function URL)
aws-config = { version = "1", optional = true }
aws-sigv4 = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }

[features]
default = ["ec2"]
ec2 = ["clap", "sigv4"]
sigv4 = ["aws-config", "aws-sigv4", "aws-credential-types", "aws-smithy-runtime-api"]

[lib]
name = "pmengine"
path = "src/lib.rs"

[[bin]]
name = "pmengine"
path = "src/main.rs"
required-features = ["ec2"]

# Read-only live check on the market WebSocket: subscribes real tokens through
# the engine's own feed path and prints event rate + book age. WS behaviour has
# no unit test; this is the manual verification that stands in for one.
[[bin]]
name = "pmengine-wsprobe"
path = "src/bin/wsprobe.rs"
required-features = ["ec2"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
