[package]
name = "pmproxy"
version = "0.5.0"
edition = "2021"
description = "Simple HTTP reverse proxy for Polymarket APIs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["ws"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebSocket client for upstream connections (EC2 only — Lambda doesn't support WS)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JWT authentication
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }

# Rate limiting
governor = "0.6"
dashmap = "6"

# Error handling
thiserror = "1"

# Config (EC2 only)
clap = { version = "4", features = ["derive"], optional = true }

# Lambda runtime
lambda_http = { version = "0.14", optional = true }

[features]
default = ["ec2"]
ec2 = ["clap", "ws"]
ws = ["tokio-tungstenite", "futures-util"]
lambda = ["lambda_http"]

[lib]
name = "pmproxy"
path = "src/lib.rs"

[[bin]]
name = "pmproxy"
path = "src/main.rs"
required-features = ["ec2"]

[[bin]]
name = "pmproxy-lambda"
path = "src/lambda.rs"
required-features = ["lambda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
