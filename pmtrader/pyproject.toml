[tool.uv]
index-url = "https://pypi.org/simple"

[project]
name = "pmtrader"
version = "0.4.0"
description = "Polymarket trading CLI + Python SDK"
requires-python = ">=3.14"
dependencies = [
    "py-clob-client-v2>=1.0.1",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "click>=8.1.0",
    "boto3>=1.42.30",
    "requests>=2.31.0",
]

[project.scripts]
pmt = "cli:cli"

[dependency-groups]
dev = [
    "pynacl>=1.6.2",
    "pytest>=8.0.0",
    "websockets>=16.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polymarket*", "scanners*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit live external services (Polymarket, deployed Lambda). Excluded from default CI; run with `pytest -m integration`.",
]
addopts = "-m 'not integration'"
